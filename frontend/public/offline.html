<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Lost | Ram Mart</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-main);
        }

        /* Background Decorative Elements */
        .blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #e0e7ff;
            top: -100px;
            right: -100px;
            animation: move 20s infinite alternate;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: #fce7f3;
            bottom: -50px;
            left: -50px;
            animation: move 15s infinite alternate-reverse;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
        }

        /* WiFi Animation */
        .wifi-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2.5rem;
            position: relative;
        }

        .wifi-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            color: var(--text-muted);
        }

        .wifi-bar {
            opacity: 0.2;
            transform-origin: bottom center;
        }

        /* Animation logic for searching/error */
        .bar-1 { animation: pulse 1.5s infinite 0.1s; }
        .bar-2 { animation: pulse 1.5s infinite 0.2s; }
        .bar-3 { animation: pulse 1.5s infinite 0.3s; }
        .bar-4 { animation: pulse 1.5s infinite 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; color: var(--text-muted); }
            50% { opacity: 1; color: var(--primary); }
        }

        .error-mark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: white;
            color: var(--error);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
            font-weight: bold;
            font-size: 20px;
            border: 2px solid var(--error);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.2);
        }

        .btn-secondary {
            background-color: white;
            color: var(--text-muted);
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .status-footer {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--error);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Mobile specific adjustments */
        @media (max-width: 640px) {
            h1 { font-size: 1.75rem; }
            .container { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <div class="wifi-icon">
            <svg class="wifi-svg" viewBox="0 0 24 24">
                <!-- WiFi Bars -->
                <path class="wifi-bar bar-1" d="M12 20h.01" />
                <path class="wifi-bar bar-2" d="M8.5 16.5a5 5 0 0 1 7 0" />
                <path class="wifi-bar bar-3" d="M5 13a10 10 0 0 1 14 0" />
                <path class="wifi-bar bar-4" d="M2 9.5a15 15 0 0 1 20 0" />
            </svg>
            <div class="error-mark">!</div>
        </div>

        <h1>Connection Lost</h1>
        <p>It looks like your device is currently offline. Please check your WiFi or mobile data and try again.</p>

        <div class="actions">
            <button class="btn btn-primary" onclick="window.location.reload()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6m12-4a9 9 0 0 1-15 6.7L3 16"/></svg>
                Try Reconnecting
            </button>
            <!-- <a href="#" class="btn btn-secondary">
                View Offline Catalog
            </a> -->
        </div>

        <div class="status-footer">
            <div class="dot"></div>
            System Status: Offline
        </div>
    </div>

    <script>
        // Optional: Check connection status and auto-reload when back online
        window.addEventListener('online', () => {
            const btn = document.querySelector('.btn-primary');
            btn.innerHTML = 'Connecting...';
            btn.style.backgroundColor = '#10b981'; // Success green
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });
    </script>
</body>
</html>
