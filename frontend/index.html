  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Load the logo script first -->
    <script type="module">
      let dots = 0;

      const interval = setInterval(() => {
        dots = (dots + 1) % 4;
        document.title = "Loading" + ".".repeat(dots);
      }, 500);

      import { logo, logoImage } from "/src/customer/json/common.js";

      // small delay to simulate loading
      setTimeout(() => {
        clearInterval(interval);

        if (logo?.name) {
          document.title = logo.name;
        }

        if (logoImage?.image) {
          const favicon = document.querySelector('link[rel="icon"]');
          if (favicon) {
            favicon.href = logoImage.image;
          }
        }
      }, 1500);
    </script>

    <script type="text/javascript">
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
